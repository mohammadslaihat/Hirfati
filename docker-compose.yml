# ملف تشغيل حاويتي التطبيق وقاعدة البيانات معاً
# أمر التشغيل هو بناء الحاويات وتشغيلها وأمر الإيقاف هو إنزالها
# السطر التالي يحدد اسم المشروع ويستخدم كبداية لأسماء الحاويات ومساحة التخزين
# القيم المتغيرة في هذا الملف تقرأ تلقائياً من ملف البيئة فلا نكتب كلمات المرور هنا
name: hirfati

# الخدمات التي تعمل معاً
# ينشئ دوكر لها شبكة داخلية مشتركة
# وكل خدمة يمكن الوصول إليها من الأخرى باسمها
services:
  # خدمة قاعدة البيانات
  db:
    # نستخدم الصورة الرسمية الجاهزة لقاعدة البيانات
    # إعادة التشغيل التلقائي إذا توقفت الحاوية بخطأ إلا إذا أوقفناها يدوياً
    image: mysql:8.0
    restart: unless-stopped
    # متغيرات تقرأها صورة قاعدة البيانات عند أول تشغيل
    # تنشئ بها قاعدة البيانات ومستخدماً خاصاً بالتطبيق وكلمة مرور المدير
    # إذا لم يوجد اسم قاعدة البيانات في ملف البيئة يستخدم الاسم الافتراضي
    # وإذا نقص اسم المستخدم أو كلمة المرور يتوقف التشغيل برسالة خطأ
    # وتوقيت الحاوية هو توقيت الأردن
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hirfati_db}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is missing in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is missing in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is missing in .env}
      TZ: Asia/Amman
    # تشغيل قاعدة البيانات بترميز يدعم النصوص العربية
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # ربط مساحات التخزين بالحاوية
    volumes:
      # مجلد بيانات قاعدة البيانات مربوط بمساحة تخزين دائمة
      # مساحة التخزين تبقى حتى لو حذفت الحاوية فلا تضيع البيانات عند الإيقاف
      # تحذف البيانات فقط عند طلب حذف مساحات التخزين صراحة
      - db_data:/var/lib/mysql
      # ربط ملفي إنشاء الجداول والبيانات التجريبية بمجلد التهيئة داخل الحاوية
      # تنفذهما قاعدة البيانات بالترتيب فقط عند أول تشغيل عندما تكون فارغة
      # والربط للقراءة فقط
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    # فحص جاهزية قاعدة البيانات كل خمس ثوان بحساب التطبيق
    # عند نجاح الفحص تصبح الخدمة جاهزة
    # عدد المحاولات ثلاثون مع مهلة أولية لتهيئة قاعدة البيانات
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # خدمة تطبيق حرفتي
  web:
    # بناء صورة التطبيق من ملف البناء الموجود في نفس المجلد
    build: .
    restart: unless-stopped
    # لا يبدأ التطبيق إلا بعد جاهزية قاعدة البيانات حتى لا يحاول الاتصال مبكراً
    depends_on:
      db:
        condition: service_healthy
    # إعدادات التطبيق ويقرؤها ملف الإعدادات من متغيرات البيئة
    environment:
      # التطبيق يتصل بقاعدة البيانات باسم خدمتها داخل الشبكة الداخلية وليس بالجهاز المحلي
      # والمنفذ هو المنفذ الداخلي لقاعدة البيانات ولا نحتاج فتحه على جهازنا
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-hirfati_db}
      # التطبيق يستخدم نفس المستخدم ونفس قاعدة البيانات التي أنشأتها خدمة قاعدة البيانات
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is missing in .env}
      # وضع التصحيح معطل لأنه أكثر أماناً
      FLASK_DEBUG: "0"
      TZ: Asia/Amman
    # ربط منفذ على جهازنا بمنفذ التطبيق داخل الحاوية
    # الموقع يفتح من المتصفح على المنفذ 5000 أو على المنفذ المحدد في ملف البيئة
    ports:
      - "${APP_PORT:-5000}:5000"

# تعريف مساحة التخزين الدائمة التي تستخدمها قاعدة البيانات
volumes:
  db_data:
