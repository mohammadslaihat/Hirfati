# حِرفتي (HIRFATI) — تشغيل Flask وMySQL معاً
# التشغيل:  docker compose up --build
# الإيقاف:  docker compose down
name: hirfati

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hirfati_db}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is missing in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is missing in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is missing in .env}
      TZ: Asia/Amman
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      # بيانات قاعدة البيانات تبقى محفوظة بعد الإيقاف وإعادة التشغيل
      - db_data:/var/lib/mysql
      # تُنفَّذ مرة واحدة فقط عند أول تشغيل (عندما يكون الـ volume فارغاً)
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Flask يتصل بخدمة MySQL باسمها داخل Docker Compose (db) وليس localhost
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-hirfati_db}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is missing in .env}
      FLASK_DEBUG: "0"
      TZ: Asia/Amman
    ports:
      - "${APP_PORT:-5000}:5000"

volumes:
  db_data:
