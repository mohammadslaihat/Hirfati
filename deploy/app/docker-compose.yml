# Hirfati - web app (Flask frontend + backend) on EC2 A
# Image is pulled from Docker Hub. The app connects to MySQL on EC2 B through the private network.
name: hirfati-app

services:
  web:
    image: ${APP_IMAGE:-mohdzaal/hirfati:latest}
    container_name: hirfati-web
    restart: unless-stopped
    # .env holds DB_HOST (10.0.11.10), DB_PORT, DB_NAME, DB_USER, DB_PASSWORD, SECRET_KEY
    # SECRET_KEY must be the same on every app server behind the load balancer
    env_file: .env
    environment:
      FLASK_DEBUG: "0"
      TZ: Asia/Amman
    # Port 5000 is reachable only from the load balancer and this server (security group hirfati-app-sg)
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
