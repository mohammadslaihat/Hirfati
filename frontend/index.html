<!DOCTYPE html>
<html lang="ar" dir="rtl">
<!-- صفحة البداية للزوار -->
<!-- فيها تعريف بالمنصة وزر إنشاء حساب وزر تسجيل الدخول -->
<!-- لغة الصفحة عربية واتجاهها من اليمين إلى اليسار -->
<!-- هذا الملف يشرح الأجزاء المشتركة الموجودة في كل صفحات الموقع -->
<head>
  <!-- رأس الصفحة يحتوي معلومات لا تظهر مباشرة للمستخدم -->
  <!-- الترميز يدعم الحروف العربية -->
  <meta charset="UTF-8">
  <!-- عرض الصفحة يساوي عرض شاشة الجهاز وهذا ضروري لعمل التصميم على الجوال -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- العنوان الذي يظهر في تبويب المتصفح -->
  <title>حِرفتي | منصة الحرفيين في الأردن</title>
  <!-- تحميل الخط العربي من خدمة الخطوط مع تجهيز الاتصال مسبقاً لتسريع التحميل -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- ربط ملف التنسيق الموحد -->
  <link rel="stylesheet" href="static/css/style.css">
</head>
<!-- جسم الصفحة وخصائصه يقرؤها ملف الدوال المشتركة -->
<!-- الخاصية الأولى اسم الصفحة والثانية مسار المجلد الرئيسي -->
<!-- هذه الصفحة لا تحتاج تسجيل دخول لذلك لا تحدد نوع حساب -->
<body data-page="landing" data-root="">

  <!-- المحتوى الرئيسي وفيه قسم التعريف بالمنصة -->
  <!-- الشعار ثم العبارة التعريفية ثم الوصف ثم الأزرار -->
  <main class="auth-page">
    <section class="landing">
      <div class="landing-logo">حِرفتي</div>
      <p class="landing-slogan">الحرفي المناسب لخدمتك.. أقرب مما تتوقع</p>
      <p>
        حِرفتي منصة أردنية تربط العملاء بأصحاب المهن والحرف في جميع محافظات المملكة.
        تصفّح ملفات الحرفيين، واطلب عروض الأسعار، واختر العرض المناسب لك بكل سهولة.
      </p>
      <div class="btn-row">
        <a href="register.html" class="btn btn-primary btn-lg">إنشاء حساب</a>
        <a href="login.html" class="btn btn-outline btn-lg">تسجيل الدخول</a>
      </div>
    </section>
  </main>

  <!-- التذييل فارغ هنا ويملؤه السكربت تلقائياً -->
  <footer id="site-footer"></footer>

  <!-- ملفات السكربت في نهاية الصفحة حتى تكون كل العناصر قد حملت قبل تشغيلها -->
  <!-- الترتيب مهم ملف الاتصال بالخادم ثم ملف الدوال المشتركة ثم ملف الصفحة إن وجد -->
  <script src="static/js/api.js"></script>
  <script src="static/js/main.js"></script>
</body>
</html>
