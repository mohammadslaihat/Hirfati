<!DOCTYPE html>
<html lang="ar" dir="rtl">
<!-- صفحة تسجيل الدخول لكل أنواع الحسابات -->
<!-- بعد الدخول يحول الخادم كل مستخدم إلى صفحته الرئيسية -->
<!-- شرح الأجزاء المشتركة في رأس الصفحة موجود في صفحة البداية -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | حِرفتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/style.css">
</head>
<!-- اسم الصفحة يجعل ملف تسجيل الدخول يشغل الدالة الخاصة بهذه الصفحة -->
<body data-page="login" data-root="">

  <main class="auth-page">
    <div class="card auth-card">
      <a href="index.html" class="brand">حِرفتي</a>
      <h1>تسجيل الدخول</h1>
      <p class="muted center">أدخل بريدك الإلكتروني وكلمة المرور للدخول إلى حسابك.</p>

      <!-- نموذج الدخول -->
      <!-- نوقف رسائل التحقق الافتراضية للمتصفح لأن السكربت يعرض رسائل عربية خاصة -->
      <!-- السكربت يلتقط إرسال النموذج ويرسل البيانات للخادم دون إعادة تحميل الصفحة -->
      <form id="login-form" novalidate>
        <!-- مكان رسالة الخطأ وهو مخفي حتى يظهر عند وجود خطأ -->
        <div id="login-error" class="form-error" hidden></div>

        <!-- كل حقل مرتبط بعنوانه فالضغط على العنوان يضع المؤشر في الحقل -->
        <!-- البريد وكلمة المرور يكتبان من اليسار إلى اليمين -->
        <div class="form-group">
          <label for="login-email">البريد الإلكتروني</label>
          <input type="email" id="login-email" dir="ltr" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="login-password">كلمة المرور</label>
          <input type="password" id="login-password" dir="ltr" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">دخول</button>
      </form>

      <!-- رابط إلى صفحة إنشاء حساب جديد -->
      <p class="auth-switch">ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="static/js/api.js"></script>
  <script src="static/js/main.js"></script>
  <!-- ملف منطق تسجيل الدخول وإنشاء الحساب -->
  <script src="static/js/auth.js"></script>
</body>
</html>
