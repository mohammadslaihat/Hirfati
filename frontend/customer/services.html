<!DOCTYPE html>
<html lang="ar" dir="rtl">
<!-- صفحة الخدمات للعميل -->
<!-- الخدمات الأساسية ثم الخدمات الأخرى التي أضافها الحرفيون -->
<!-- شرح الأجزاء المشتركة في رأس الصفحة موجود في صفحة البداية -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الخدمات | حِرفتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<!-- صفحة خاصة بالعميل ودالتها في ملف صفحات العميل -->
<body data-role="customer" data-page="services" data-root="../">
  <header id="site-header"></header>

  <main class="container page">
    <h1 class="page-title">الخدمات</h1>
    <p class="section-sub">جميع الخدمات المتوفرة في حِرفتي. اضغط على الخدمة لعرض الحرفيين المتخصصين بها.</p>

    <!-- بطاقات الخدمات الأساسية وكل بطاقة رابط إلى الحرفيين في هذه الخدمة -->
    <div class="grid grid-4" id="services-grid"></div>

    <!-- قسم الخدمات الأخرى -->
    <!-- بطاقة جميع الخدمات الأخرى ثم بطاقة لكل خدمة أخرى يقدمها حرفي -->
    <section class="section">
      <h2 class="section-title">خدمات أخرى</h2>
      <p class="section-sub">خدمات يقدمها حرفيون خارج المهن الأساسية، أضافوها بأنفسهم عند إنشاء إعلاناتهم.</p>
      <div class="grid grid-4" id="other-services-grid"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="../static/js/api.js"></script>
  <script src="../static/js/main.js"></script>
  <script src="../static/js/customer.js"></script>
</body>
</html>
