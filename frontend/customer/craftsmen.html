<!DOCTYPE html>
<html lang="ar" dir="rtl">
<!-- صفحة الحرفيين -->
<!-- البحث حسب الخدمة والمحافظة وعرض النتائج كبطاقات ومشتركو برو أولاً -->
<!-- شرح الأجزاء المشتركة في رأس الصفحة موجود في صفحة البداية -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحرفيون | حِرفتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<!-- صفحة خاصة بالعميل ودالتها في ملف صفحات العميل -->
<body data-role="customer" data-page="craftsmen" data-root="../">
  <header id="site-header"></header>

  <main class="container page">
    <h1 class="page-title">الحرفيون</h1>
    <p class="section-sub">تصفّح الحرفيين المسجلين في المنصة وافتح ملف من يناسبك.</p>

    <!-- نموذج الفلترة يرسل إلى نفس الصفحة فتصبح الفلاتر جزءاً من الرابط -->
    <!-- ثم يقرؤها السكربت ويطلب الحرفيين المطابقين من الخادم -->
    <form class="filter-box" id="filter-form">
      <div class="form-group">
        <label for="filter-service">نوع الخدمة</label>
        <select id="filter-service" name="service"></select>
      </div>
      <div class="form-group">
        <label for="filter-governorate">الموقع (المحافظة)</label>
        <select id="filter-governorate" name="gov"></select>
      </div>
      <button type="submit" class="btn btn-primary">بحث</button>
    </form>

    <!-- مكان بطاقات الحرفيين أو رسالة عدم وجود نتائج -->
    <div class="grid grid-3 section" id="craftsmen-grid"></div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../static/js/api.js"></script>
  <script src="../static/js/main.js"></script>
  <script src="../static/js/customer.js"></script>
</body>
</html>
