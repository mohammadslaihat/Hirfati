<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مراقبة الاشتراكات | لوحة تحكم حِرفتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body data-role="admin" data-page="subscriptions" data-root="../">
  <header id="site-header"></header>

  <main class="container page">
    <h1 class="page-title">مراقبة الاشتراكات</h1>
    <p class="section-sub">جميع الحرفيين المشتركين في Pro (فعال، ملغى، منتهي) مع تواريخ الاشتراك والإلغاء وسجل كل حرفي.</p>

    <div class="tabs" id="tabs" role="tablist">
      <button type="button" class="tab active" data-filter="pro">جميع مشتركي Pro</button>
      <button type="button" class="tab" data-filter="active">فعال</button>
      <button type="button" class="tab" data-filter="cancelled">ملغى</button>
      <button type="button" class="tab" data-filter="expired">منتهي</button>
      <button type="button" class="tab" data-filter="basic">Basic فقط</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </main>

  <!-- نافذة عرض التفاصيل -->
  <div class="modal" id="details-modal" hidden>
    <div class="modal-box modal-wide" role="dialog" aria-modal="true" aria-labelledby="details-title">
      <div class="modal-head">
        <h2 id="details-title">التفاصيل</h2>
        <button type="button" class="modal-close" data-close-modal aria-label="إغلاق">×</button>
      </div>
      <dl class="details-list" id="details-body"></dl>
      <h3 class="history-title">سجل الاشتراكات</h3>
      <div id="history-body"></div>
    </div>
  </div>

  <footer id="site-footer"></footer>

  <script src="../static/js/api.js"></script>
  <script src="../static/js/main.js"></script>
  <script src="../static/js/admin.js"></script>
</body>
</html>
