<!DOCTYPE html>
<html lang="ar" dir="rtl">
<!-- صفحة إدارة المستخدمين في لوحة تحكم الأدمن -->
<!-- تعرض حسابات العملاء والحرفيين المسجلين في المنصة -->
<!-- شرح الأجزاء المشتركة في رأس الصفحة موجود في صفحة البداية -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المستخدمين | لوحة تحكم حِرفتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<!-- الصفحة خاصة بالأدمن فقط ودالتها في ملف صفحات الأدمن -->
<body data-role="admin" data-page="users" data-root="../">
  <header id="site-header"></header>

  <main class="container page">
    <h1 class="page-title">إدارة المستخدمين</h1>
    <p class="section-sub">حسابات العملاء والحرفيين المسجلين في المنصة.</p>

    <!-- تبويبان للعملاء والحرفيين والجدول يتغير حسب التبويب المختار -->
    <div class="tabs" id="tabs" role="tablist">
      <button type="button" class="tab active" data-filter="customer">العملاء</button>
      <button type="button" class="tab" data-filter="craftsman">الحرفيون</button>
    </div>

    <!-- جدول المستخدمين ويرسمه السكربت -->
    <div class="table-wrap">
      <table>
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </main>

  <!-- نافذة عرض بيانات الحساب -->
  <div class="modal" id="details-modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="details-title">
      <div class="modal-head">
        <h2 id="details-title">التفاصيل</h2>
        <!-- زر إغلاق النافذة -->
        <button type="button" class="modal-close" data-close-modal aria-label="إغلاق">×</button>
      </div>
      <!-- قائمة البيانات بعناوين الحقول وقيمها -->
      <dl class="details-list" id="details-body"></dl>
    </div>
  </div>

  <footer id="site-footer"></footer>

  <script src="../static/js/api.js"></script>
  <script src="../static/js/main.js"></script>
  <script src="../static/js/admin.js"></script>
</body>
</html>
