<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الشكاوى | لوحة تحكم حِرفتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body data-role="admin" data-page="complaints" data-root="../">
  <header id="site-header"></header>

  <main class="container page">
    <h1 class="page-title">إدارة الشكاوى</h1>
    <p class="section-sub">جميع الشكاوى المرسلة من العملاء والحرفيين، مع إمكانية تحديث حالة كل شكوى.</p>

    <div class="tabs" id="tabs" role="tablist">
      <button type="button" class="tab active" data-filter="all">جميع الشكاوى</button>
      <button type="button" class="tab" data-filter="new">جديدة</button>
      <button type="button" class="tab" data-filter="processing">قيد المعالجة</button>
      <button type="button" class="tab" data-filter="resolved">تمت المعالجة</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </main>

  <!-- نافذة عرض التفاصيل -->
  <div class="modal" id="details-modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="details-title">
      <div class="modal-head">
        <h2 id="details-title">التفاصيل</h2>
        <button type="button" class="modal-close" data-close-modal aria-label="إغلاق">×</button>
      </div>
      <dl class="details-list" id="details-body"></dl>
    </div>
  </div>

  <footer id="site-footer"></footer>

  <script src="../static/js/api.js"></script>
  <script src="../static/js/main.js"></script>
  <script src="../static/js/admin.js"></script>
</body>
</html>
